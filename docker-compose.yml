version: '3.8'
services:
  qdrant:
    image: qdrant/qdrant:1.6.0
    restart: unless-stopped
    volumes:
      - ./index/legal_rag_qdrant:/qdrant/storage
      - ./data:/app/data
    ports:
      - "6333:6333"
    command: ["--storage-dir", "/qdrant/storage"]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    depends_on:
      - qdrant
